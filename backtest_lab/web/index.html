<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Kula Balam - Laboratorio de Estrategias</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f141c; color: #e1e7ec; padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #232d3f; padding-bottom: 15px; margin-bottom: 20px; }
    h1 { font-size: 1.4rem; color: #00d26a; }
    .controls { display: flex; gap: 15px; align-items: center; }
    select, button { background: #1a2332; color: #fff; border: 1px solid #33445c; padding: 8px 14px; border-radius: 6px; font-size: 0.9rem; cursor: pointer; }
    select:focus, button:focus { outline: none; border-color: #00d26a; }
    button.run { background: #008744; font-weight: bold; }
    button.run:hover { background: #00a854; }
    button.copy { background: #2c3e50; }
    .container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; height: calc(100vh - 120px); }
    .panel { display: flex; flex-direction: column; background: #161e2b; border: 1px solid #232d3f; border-radius: 8px; overflow: hidden; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; background: #1a2332; padding: 10px 15px; font-weight: 600; font-size: 0.85rem; border-bottom: 1px solid #232d3f; }
    textarea { flex: 1; width: 100%; background: #0b0f17; color: #a9b7c6; border: none; padding: 15px; font-family: 'Consolas', 'Courier New', monospace; font-size: 0.88rem; resize: none; outline: none; line-height: 1.4; }
    #output { color: #50fa7b; white-space: pre-wrap; overflow-y: auto; }
  
    select {
    }
    select option {
    }
    select:focus {
    }

  
    .controls { 
      display: flex; 
      gap: 16px; 
      align-items: center; 
    }
    .select-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .select-group span {
      color: #94a3b8;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    select.modern-select {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      background-color: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 8px 36px 8px 14px;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      min-width: 170px;
      outline: none;
      transition: all 0.2s ease;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 14px;
    }
    select.modern-select:hover {
      border-color: #00d26a;
      background-color: #243247;
    }
    select.modern-select:focus {
      border-color: #00d26a;
      box-shadow: 0 0 0 2px rgba(0, 210, 106, 0.2);
    }
    select.modern-select option {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 10px;
    }

</style>
</head>
<body>
      <header>
    <h1>Kula Balam // Sandbox de Backtesting</h1>
    <div class="controls">
      <div class="select-group">
        <span>Mercado:</span>
        <select id="selCategory" class="modern-select" onchange="actualizarTickers()"></select>
      </div>

      <div class="select-group">
        <span>Activo:</span>
        <select id="selTicker" class="modern-select">
        </select>
        <label for="selEstrategia" style="margin-left: 10px; font-weight: 500;">Estrategia Guardada:</label>
        <select id="selEstrategia" class="modern-select" onchange="cargarCodigoEstrategia()">
          <option value="">-- Cargar plantilla / auditoría --</option>
        </select>
    
      </div>

      <button class="run" onclick="runStrategy()">▶ Ejecutar Estrategia</button>
    </div>
  </header>

  <div class="container">
    <div class="panel">
      <div class="panel-header">
        <span>Fórmula / Script Python</span>
        <button type="button" id="btn-borrar-todo" onclick="borrarTodo()" class="btn" style="background-color: #e53e3e; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;">Borrar Todo</button>
      </div>
      <textarea id="codeEditor" spellcheck="false"></textarea>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span>Consola de Resultados</span>
        <button class="copy" onclick="copiarResultados()">📋 Copiar Resultados</button>
      </div>
      <textarea id="output" readonly placeholder="Los resultados del backtest aparecerán aquí..."></textarea>
    </div>
  </div>

  
  <script>
    let catalogoDatasets = {};

    async function cargarDatasets() {
      const selCat = document.getElementById('selCategory');

      try {
        const res = await fetch('/api/datasets');
        catalogoDatasets = await res.json();

        selCat.innerHTML = '';
        const cats = Object.keys(catalogoDatasets);
        
        cats.forEach(cat => {
          const opt = document.createElement('option');
          opt.value = cat;
          opt.textContent = cat === 'datos_historicos' ? 'Datos Históricos (Multimercado)' : cat;
          selCat.appendChild(opt);
        });

        actualizarTickers();
      } catch (err) {
        console.error('Error cargando datasets:', err);
      }
    }

    function actualizarTickers() {
      const selCat = document.getElementById('selCategory');
      const selTick = document.getElementById('selTicker');

      const cat = selCat.value;
      const items = catalogoDatasets[cat] || [];

      selTick.innerHTML = '';
      items.forEach(ticker => {
        const opt = document.createElement('option');
        opt.value = ticker;
        opt.textContent = ticker;
        selTick.appendChild(opt);
      });
    }

    function borrarTodo() {
      const editor = document.getElementById('codeEditor');
      if (editor) editor.value = '';

      const output = document.getElementById('output');
      if (output) output.value = '';
    }

    function copiarResultados() {
      const output = document.getElementById('output');
      navigator.clipboard.writeText(output.value);
    }

    async function runStrategy() {
      const codeEditor = document.getElementById('codeEditor');
      const output = document.getElementById('output');
      const selCat = document.getElementById('selCategory');
      const selTick = document.getElementById('selTicker');


      const codeVal = codeEditor.value;
      const catVal = selCat ? selCat.value : 'datos_historicos';
      const tickVal = selTick ? selTick.value : '';

      output.value = 'Ejecutando backtest... por favor espera...';

      try {
        const res = await fetch('/api/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            category: catVal,
            ticker: tickVal,
            code: codeVal
          })
        });

        const data = await res.json();
        if (data.output !== undefined) {
          output.value = data.output;
        } else {
          output.value = JSON.stringify(data, null, 2);
        }
      } catch (err) {
        output.value = 'Error de conexión: ' + err.message;
      }
    }

    
    async function cargarListaEstrategias() {
      const selEst = document.getElementById('selEstrategia');

      try {
        const res = await fetch('/api/estrategias');
        const lista = await res.json();
        
        selEst.innerHTML = '<option value="">-- Cargar plantilla / auditoría --</option>';
        lista.forEach(item => {
          const opt = document.createElement('option');
          opt.value = item;
          opt.textContent = item;
          selEst.appendChild(opt);
        });
      } catch (err) {
        console.error('Error cargando estrategias:', err);
      }
    }

    async function cargarCodigoEstrategia() {
      const selEst = document.getElementById('selEstrategia');
      const editor = document.getElementById('codeEditor');

      try {
        const res = await fetch('/api/estrategias/' + encodeURIComponent(selEst.value));
        const data = await res.json();
        if (data.codigo) {
          editor.value = data.codigo;
        }
      } catch (err) {
        console.error('Error al obtener código:', err);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      cargarListaEstrategias();
      cargarDatasets();
      const editor = document.getElementById('codeEditor');
      if (editor) editor.value = '';
    });
  </script>

</body>
</html>
